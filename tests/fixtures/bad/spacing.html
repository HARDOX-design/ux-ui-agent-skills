<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>spacing defects</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; background:#ffffff; color:#1d1d1f; font:16px/1.5 system-ui, sans-serif; }
  main { padding:24px; display:grid; gap:32px; }
  /* Three defects verify_spacing.mjs must reject:
     1. two cards side by side that end on different lines (align-items:start);
     2. a line of text sitting 2px above the buttons under it;
     3. two separate buttons 4px apart. */
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .card { border:1px solid #d0d5d9; border-radius:12px; padding:16px; }
  .address { margin:0 0 2px; }
  .actions { display:flex; gap:4px; }
  button { font:inherit; padding:8px 16px; border:1px solid #868d93; border-radius:8px; background:#ffffff; }
</style></head>
<body><main>
  <div class="row">
    <article class="card"><h2>At the office</h2><p>Monday to Friday, 08:30 to 16:30.</p><p>Saturday, 09:00 to 12:00.</p><p>Closed on Sundays.</p></article>
    <article class="card"><h2>By post</h2><p>Send the form and copies.</p></article>
  </div>
  <section>
    <p class="address">27 Tamarind Lane</p>
    <div class="actions"><button type="button">Copy address</button><button type="button">Email us</button></div>
  </section>
</main></body></html>
